<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>オンラインミートアップ — リンク集</title>
<style>
:root{--bg:#f6f8fb;--card:#ffffff;--accent:#2563eb;--muted:#6b7280}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Hiragino Kaku Gothic ProN',Meiryo,Arial; margin:0; background:var(--bg); color:#0f172a}
.wrap{max-width:820px;margin:36px auto;padding:24px}
header{display:flex;align-items:center;gap:16px}
h1{font-size:20px;margin:0}
p.lead{margin:6px 0 18px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 6px 20px rgba(16,24,40,0.06);display:flex;flex-direction:column;gap:10px}
.title{font-weight:600}
.subtitle{color:var(--muted);font-size:13px}
.link{display:inline-block;padding:10px 12px;border-radius:8px;background:linear-gradient(180deg,var(--accent),#1e40af);color:white;text-decoration:none;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button.copy{background:#eef2ff;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
footer{margin-top:18px;color:var(--muted);font-size:13px}
.small{font-size:13px;color:var(--muted)}
@media (max-width:420px){.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden>
<rect width="24" height="24" rx="6" fill="#eef2ff"/>
<path d="M8 7h8v2H8zM8 11h8v2H8zM8 15h5v2H8z" fill="#2563eb"/>
</svg>
<div>
<h1>ミートリンク集</h1>
<p class="lead">下のボタンからGoogle Meetに入室できます。リンクをコピーすることもできます。</p>
</div>
</header>


<main class="grid" role="main">


<article class="card">
<div>
<div class="title">Lobby</div>
<div class="subtitle">https://meet.google.com/oxm-yuzz-bnj</div>
</div>
<div class="actions">
<a class="link" href="https://meet.google.com/oxm-yuzz-bnj" target="_blank" rel="noopener">参加する</a>
<button class="copy" data-link="https://meet.google.com/oxm-yuzz-bnj">リンクをコピー</button>
</div>
</article>


<article class="card">
<div>
<div class="title">Group (one) — Our City</div>
<div class="subtitle">https://meet.google.com/svz-mwjr-zkk</div>
</div>
<div class="actions">
<a class="link" href="https://meet.google.com/svz-mwjr-zkk" target="_blank" rel="noopener">参加する</a>
<button class="copy" data-link="https://meet.google.com/svz-mwjr-zkk">リンクをコピー</button>
</div>
</article>


<article class="card">
<div>
<div class="title">Group (two) — Food</div>
<div class="subtitle">https://meet.google.com/boh-iiex-anb</div>
</html>
